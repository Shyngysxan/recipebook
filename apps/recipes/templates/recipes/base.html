<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Recipebook — рецепттер каталогы{% endblock %}</title>
<style>
  :root {
    --bg: #fffaf5;
    --card: #ffffff;
    --text: #2b2118;
    --muted: #7a6a5c;
    --primary: #d9480f;
    --primary-dark: #b53a0a;
    --soft: #ffe8d9;
    --border: #f0e2d6;
    --shadow: 0 2px 10px rgba(80, 40, 10, .08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
  }
  a { color: inherit; text-decoration: none; }
  .site-header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: rgba(255, 255, 255, .95);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(6px);
  }
  .logo { font-size: 1.35rem; font-weight: 800; color: var(--primary); }
  .site-header nav a { color: var(--muted); font-weight: 600; }
  .site-header nav a:hover { color: var(--primary); }
  .site-header nav { display: flex; align-items: center; gap: 18px; }
  .nav-user { color: var(--text); font-weight: 700; }
  .nav-btn {
    font: inherit;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: 999px;
    border: 1px solid var(--primary);
    background: transparent;
    color: var(--primary);
    cursor: pointer;
  }
  .nav-btn:hover { background: var(--primary); color: #fff; }
  .site-header nav a.nav-btn-fill { background: var(--primary); color: #fff; padding: 7px 16px; border-radius: 999px; }
  .site-header nav a.nav-btn-fill:hover { background: var(--primary-dark); color: #fff; }
  .site-header form { margin: 0; }
  @media (max-width: 560px) {
    .site-header { padding: 12px 14px; }
    .site-header nav { gap: 10px; font-size: .9rem; }
    .nav-hide-sm { display: none; }
  }
  .container { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
  .tile {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.4rem;
    user-select: none;
  }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    background: var(--soft);
    color: var(--primary-dark);
    font-size: .78rem;
    font-weight: 700;
  }
  .state-box { text-align: center; color: var(--muted); padding: 48px 0; }
  .site-footer {
    margin-top: 56px;
    padding: 24px;
    text-align: center;
    color: var(--muted);
    font-size: .85rem;
    border-top: 1px solid var(--border);
  }
  {% block style %}{% endblock %}
</style>
</head>
<body>
<header class="site-header">
  <a class="logo" href="/">🍳 Recipebook</a>
  <nav>
    <a class="nav-hide-sm" href="/">Барлық рецепттер</a>
    {% if user.is_authenticated %}
      <span class="nav-user">👤 {{ user.username }}</span>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="nav-btn">Шығу</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}">Кіру</a>
      <a class="nav-btn-fill" href="{% url 'register' %}">Тіркелу</a>
    {% endif %}
  </nav>
</header>

{% block content %}{% endblock %}

<footer class="site-footer">Recipebook · рецепттер каталогы · оқу жобасы</footer>

<script>
  const API = "/api/recipes/";

  async function getJSON(url) {
    const response = await fetch(url);
    let data = null;
    try {
      data = await response.json();
    } catch (error) {
      // жауап бос немесе JSON емес
    }
    if (!response.ok) {
      const text = data && (data.message || data.detail);
      const failure = new Error(text || "Қате: " + response.status);
      failure.status = response.status;
      throw failure;
    }
    return data;
  }

  function getCookie(name) {
    const match = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
    return match ? decodeURIComponent(match[1]) : "";
  }

  // POST / PUT / DELETE жіберу (CSRF токенімен). Мысалы: sendJSON("POST", API, {title: "..."})
  async function sendJSON(method, url, body) {
    const response = await fetch(url, {
      method,
      headers: { "Content-Type": "application/json", "X-CSRFToken": getCookie("csrftoken") },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    let data = null;
    try {
      data = await response.json();
    } catch (error) {
      // жауап бос немесе JSON емес
    }
    if (!response.ok) {
      const failure = new Error((data && data.message) || "Қате: " + response.status);
      failure.status = response.status;
      failure.errors = data && data.errors;
      throw failure;
    }
    return data;
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  function tileColor(id) {
    return "hsl(" + ((id * 47) % 360) + ", 70%, 90%)";
  }

  function ratingText(recipe) {
    if (recipe.rating_avg === null || recipe.reviews_count === 0) return "Баға әлі жоқ";
    return "★ " + recipe.rating_avg.toFixed(1) + " (" + recipe.reviews_count + ")";
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
